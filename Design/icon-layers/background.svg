<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><defs>
    <!-- Night-room background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30346A"/>
      <stop offset="0.55" stop-color="#1C1F45"/>
      <stop offset="1" stop-color="#101228"/>
    </linearGradient>
    <!-- Warm light spilling into the room -->
    <radialGradient id="spill" cx="512" cy="450" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB547" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FF9A3C" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF9A3C" stop-opacity="0"/>
    </radialGradient>
    <!-- Glass -->
    <radialGradient id="glass" cx="470" cy="370" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFBEA"/>
      <stop offset="0.35" stop-color="#FFE08A"/>
      <stop offset="0.8" stop-color="#FFB23E"/>
      <stop offset="1" stop-color="#FF9A2E"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9DA2B8"/>
      <stop offset="0.45" stop-color="#E6E8F0"/>
      <stop offset="1" stop-color="#8C91A8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <path id="bulb" d="M512 262 C418 262 342 338 342 432 C342 494 372 538 410 575 C432 597 438 616 438 645 L586 645 C586 616 592 597 614 575 C652 538 682 494 682 432 C682 338 606 262 512 262 Z"/>
  </defs><g transform="translate(512 512) scale(1.2427) translate(-512 -512)"><rect x="-200" y="-200" width="1424" height="1424" fill="url(#bg)"/>
      <rect x="-200" y="-200" width="1424" height="1424" fill="url(#spill)"/>
      <rect x="-200" y="-200" width="1424" height="1424" fill="url(#sheen)"/></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>