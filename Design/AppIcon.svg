<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- Night-room background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30346A"/>
      <stop offset="0.55" stop-color="#1C1F45"/>
      <stop offset="1" stop-color="#101228"/>
    </linearGradient>
    <!-- Warm light spilling into the room -->
    <radialGradient id="spill" cx="512" cy="450" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB547" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FF9A3C" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF9A3C" stop-opacity="0"/>
    </radialGradient>
    <!-- Glass -->
    <radialGradient id="glass" cx="470" cy="370" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFBEA"/>
      <stop offset="0.35" stop-color="#FFE08A"/>
      <stop offset="0.8" stop-color="#FFB23E"/>
      <stop offset="1" stop-color="#FF9A2E"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9DA2B8"/>
      <stop offset="0.45" stop-color="#E6E8F0"/>
      <stop offset="1" stop-color="#8C91A8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <path id="bulb" d="M512 262 C418 262 342 338 342 432 C342 494 372 538 410 575 C432 597 438 616 438 645 L586 645 C586 616 592 597 614 575 C652 538 682 494 682 432 C682 338 606 262 512 262 Z"/>
  </defs>

  <!-- Full-bleed and fully opaque: macOS 26+ applies its own squircle mask to opaque icons;
       any transparency (margins, drop shadow) gets the icon put on a grey frame instead. -->
  <rect width="1024" height="1024" fill="#101228"/>
  <g transform="translate(512 512) scale(1.2427) translate(-512 -512)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#spill)"/>

    <!-- Glow behind the bulb -->
    <use href="#bulb" fill="#FFC24D" opacity="0.85" filter="url(#glow)"/>

    <!-- Screw base -->
    <rect x="440" y="645" width="144" height="32" rx="14" fill="url(#metal)"/>
    <rect x="446" y="684" width="132" height="28" rx="13" fill="url(#metal)" opacity="0.92"/>
    <path d="M470 718 H554 V728 C554 748 538 762 512 762 C486 762 470 748 470 728 Z" fill="#6E7390"/>

    <!-- Glass -->
    <use href="#bulb" fill="url(#glass)"/>
    <!-- Filament -->
    <path d="M486 640 V540 M538 640 V540" stroke="#E0892A" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
    <path d="M486 540 C494 518 504 518 512 532 C520 546 530 546 538 540" fill="none" stroke="#F07A12" stroke-width="10"
          stroke-linecap="round" opacity="0.6"/>
    <!-- Highlight -->
    <ellipse cx="452" cy="372" rx="38" ry="66" transform="rotate(-28 452 372)" fill="#FFFFFF" opacity="0.7" filter="url(#soft)"/>

    <!-- Top sheen on the tile -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#sheen)"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
